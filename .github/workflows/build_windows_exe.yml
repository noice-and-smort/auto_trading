name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r req.txt

      - name: Build Standalone EXEs with PyInstaller
        run: |
          pyinstaller --onefile --name AutoTrading --collect-all jugaad_data --collect-all certifi --hidden-import=pandas --hidden-import=numpy --hidden-import=requests --hidden-import=dateutil src/script.py
          pyinstaller --onefile --name ClearCache --hidden-import=appdirs src/clear_cache.py

      - name: Prepare Windows Package Folder
        run: |
          New-Item -ItemType Directory -Force -Path dist/AutoTrading_Windows/data
          Copy-Item dist/AutoTrading.exe dist/AutoTrading_Windows/
          Copy-Item dist/ClearCache.exe dist/AutoTrading_Windows/
          Copy-Item data/stocks dist/AutoTrading_Windows/data/
          Copy-Item .env.example dist/AutoTrading_Windows/.env
          Copy-Item README.md dist/AutoTrading_Windows/

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTrading_Windows
          path: dist/AutoTrading_Windows

      - name: Publish Latest Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Compress-Archive -Path dist/AutoTrading_Windows/* -DestinationPath dist/AutoTrading_Windows.zip -Force
          gh release view latest >$null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create latest dist/AutoTrading_Windows.zip --title "Latest Windows Build" --notes "Automatically updated Windows executable package (AutoTrading.exe + ClearCache.exe)."
          } else {
            gh release upload latest dist/AutoTrading_Windows.zip --clobber
          }
